[project]
name = "minutehand"
version = "0.0.1"
description = "Build your proactive agent yourself: simulated days, fake services, real findings."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
dependencies = [
    "pydantic>=2.9",
    "mitmproxy>=12,<13",
    "asgiref>=3.8",
    "starlette>=0.40",
    "flask>=3",
    "httpx>=0.27",
    "pyyaml>=6",
    "moto[server]>=5.2",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "mcp>=1.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyright>=1.1.390", "ruff>=0.8", "boto3>=1.35", "slack_sdk>=3.33", "psutil>=6",
       "uvicorn>=0.30", "asana>=5", "google-api-python-client>=2.150", "google-auth>=2.35",
       "pytest-socket>=0.7", "pytest-timeout>=2.3", "pytest-randomly>=3.15", "pytest-xdist>=3.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minutehand"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]
# A test that reaches a real service is a broken test: only this machine is reachable.
# A test that hangs fails at 60 seconds. Tests run in a random order every time.
addopts = "--strict-markers --strict-config --disable-socket --allow-hosts=127.0.0.1,::1,localhost --allow-unix-socket --timeout=60"
filterwarnings = [
    # A warning raised against our own code is an error. Third-party internals are left alone.
    "error:::minutehand",
    "error:::tests",
    "error:::lints",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "lints", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120
target-version = "py312"
