[project]
name = "minutehand"
# The one place the version is written. `minutehand --version` and `minutehand.__version__` read it from the
# installed package's metadata; a release's tag is `v` and this (docs/releasing.md). `minutehand-agent` is released
# with it: packages/minutehand-agent/pyproject.toml and the pin below repeat it, and tests/test_version.py and the
# release workflow refuse any difference.
version = "0.0.2"
description = "Build your proactive agent yourself: simulated days, fake services, real findings."
readme = "README.md"
requires-python = ">=3.12"
# An SPDX expression (PEP 639). FSL-1.1-ALv2 is on the SPDX list since 3.26 and in `packaging` since 26.0, which
# both hatchling (below) and PyPI's upload validation check it with.
license = "FSL-1.1-ALv2"
license-files = ["LICENSE.md"]
authors = [{ name = "Alknoma" }]
keywords = ["agents", "ai-agents", "testing", "simulation", "proxy", "fakes", "pytest", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Mocking",
    "Typing :: Typed",
]
dependencies = [
    # What the agent imports (`minutehand_agent`), released with this at the same version; this package reads the
    # names of the variables it hands the agent from it. From the workspace in development ([tool.uv.sources]).
    "minutehand-agent==0.0.2",
    "pydantic>=2.9",
    "mitmproxy>=12,<13",
    "asgiref>=3.8",
    "starlette>=0.40",
    "flask>=3",
    "httpx>=0.27",
    "certifi>=2024.2.2",
    "pyyaml>=6",
    "moto[server]>=5.2",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-proto>=1.27",
    "protobuf>=5",
    "uvicorn>=0.30",
    "mcp>=1.2,<2",
    "zstandard>=0.23",
    "jsonschema>=4.20",
    # uvicorn's WebSocket protocol for the providers' socket servers (Slack's Socket Mode); mitmproxy needs it too.
    "wsproto>=1.2",
]

[project.optional-dependencies]
# gRPC: receiving an agent's OTLP over gRPC on the same port as OTLP/HTTP, and answering the gRPC transport of
# Google's client libraries (Cloud Tasks), whose messages come from Google's own package.
grpc = ["grpcio>=1.60", "google-cloud-tasks>=2.16"]

[project.urls]
Repository = "https://github.com/Alknoma/minutehand"
Issues = "https://github.com/Alknoma/minutehand/issues"
Documentation = "https://github.com/Alknoma/minutehand/tree/integration-main/docs"

[project.scripts]
minutehand = "minutehand.cli:main"

[project.entry-points.pytest11]
# Fixtures only, imported lazily: a suite that requests none of them is unchanged.
minutehand = "minutehand.testing.plugin"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pyright>=1.1.390",
    "ruff>=0.8",
    "boto3>=1.35",
    "slack_sdk>=3.33",
    "psutil>=6",
    "uvicorn>=0.30",
    "asana>=5",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-cloud-tasks>=2.16",
    "pytest-socket>=0.7",
    "pytest-timeout>=2.3",
    "pytest-randomly>=3.15",
    "pytest-xdist>=3.6",
    "aiohttp>=3.10",
    "pysocks>=1.7",
    "notion-client==2.2.1",
    "pyjwt[crypto]>=2.10",
    "python-docx==1.2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "pytest-split>=0.10",
]
recipes = [
    "anthropic>=1.11.0",
    "claude-agent-sdk>=0.2.163",
    "langchain-openai>=1.0",
    "langgraph>=1.2.14",
    "openai-agents>=0.4.2",
    # openai-agents 0.4, all that resolves beside mitmproxy on Python 3.12, fails on the usage field openai 2.45 made required.
    "openai<2.45; python_full_version < '3.13'",
    "pydantic-ai-slim[openai]>=1.60.0",
]

[tool.uv.workspace]
members = ["packages/minutehand-agent"]

[tool.uv.sources]
minutehand-agent = { workspace = true }

[build-system]
# hatchling 1.27 writes PEP 639 licence metadata (Metadata-Version 2.4 and later); packaging 26 is the first to know
# FSL-1.1-ALv2, and hatchling refuses an expression its packaging does not know.
requires = ["hatchling>=1.27", "packaging>=26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# What the installed command needs, by pattern: its code, the pages it serves, each provider's notes and the scenario
# library. Nothing else under src/minutehand/ ships; tests/packaging fails when a file git tracks there is left out of
# the wheel.
include = [
    "/src/minutehand/**/*.py",
    "/src/minutehand/**/*.html",
    "/src/minutehand/**/*.css",
    "/src/minutehand/**/*.js",
    "/src/minutehand/**/*.md",
    "/src/minutehand/**/*.txt",
    # PEP 561: a suite type-checking its use of `minutehand.testing` reads our annotations.
    "/src/minutehand/py.typed",
    "/src/minutehand/library/*.yaml",
]
sources = ["src"]

[tool.hatch.build.targets.sdist]
# The source a wheel is built from, and the example a newcomer runs first.
only-include = ["src/minutehand", "examples", "README.md", "LICENSE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]
# A test that reaches a real service is a broken test: only this machine is reachable.
# A test that hangs fails at 60 seconds. Tests run in a random order every time.
addopts = "--strict-markers --strict-config --disable-socket --allow-hosts=127.0.0.1,::1,localhost --allow-unix-socket --timeout=60 -m 'not packaging and not benchmark and not docker and not recipes'"
markers = [
    "packaging: builds and installs the package and the image; needs a package index and Docker; run with -m packaging",
    "benchmark: measures the store's bytes on disk and its times over three large synthetic runs; minutes, not seconds; run with -m benchmark -s",
    "recipes: runs examples/recipes, an agent per framework, through both scenarios; needs uv sync --group recipes, and node and npm for the Node one; run with -m recipes",
    "docker: runs a downloaded open-source emulator in a container named minutehand-ext-*; needs Docker; run with -m docker",
    "own_ca: the proxy CA this test's proxy makes is its own, never a copy of the worker's (tests/conftest.py); for a test about the CA itself",
    "conformance: one property of docs/conformance.md held against one provider through its vendor API, the control API and the world's record; runs by default",
]
filterwarnings = [
    # A warning raised against our own code is an error. Third-party internals are left alone.
    "error:::minutehand",
    "error:::tests",
    "error:::lints",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "packages/minutehand-agent/src", "lints", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Named here so the same rules run on every machine and in CI.
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # the formatter wraps code; a long sentence in a docstring or message is left alone
    "RUF012",  # a list default on a Pydantic model is copied per instance; the rule assumes a plain class
    "SIM401",  # suggests dict.get, which the house rules forbid on anything crossing a boundary
    "SIM117",  # nested `with` blocks are sometimes the clearer shape
    "UP047",   # rewriting generic functions to PEP 695 is a style change with no checker behind it
]

[tool.ruff.lint.per-file-ignores]
# The test agent arms a stuck-startup dump before it imports anything else.
"tests/e2e/agents/slack_agent.py" = ["E402"]
