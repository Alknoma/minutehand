[project]
name = "minutehand"
version = "0.0.1"
description = "Build your proactive agent yourself: simulated days, fake services, real findings."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
dependencies = [
    "pydantic>=2.9",
    "mitmproxy>=12,<13",
    "asgiref>=3.8",
    "starlette>=0.40",
    "flask>=3",
    "httpx>=0.27",
    "certifi>=2024.2.2",
    "pyyaml>=6",
    "moto[server]>=5.2",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-proto>=1.27",
    "protobuf>=5",
    "uvicorn>=0.30",
    "mcp>=1.2,<2",
]

[project.scripts]
minutehand = "minutehand.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyright>=1.1.390", "ruff>=0.8", "boto3>=1.35", "slack_sdk>=3.33", "psutil>=6",
       "uvicorn>=0.30", "asana>=5", "google-api-python-client>=2.150", "google-auth>=2.35",
       "pytest-socket>=0.7", "pytest-timeout>=2.3", "pytest-randomly>=3.15", "pytest-xdist>=3.6", "pysocks>=1.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# What the installed command needs, by pattern: its code, and the pages it serves. Nothing else under
# src/minutehand/ ships; tests/packaging fails when a file git tracks there is left out of the wheel.
include = [
    "/src/minutehand/**/*.py",
    "/src/minutehand/**/*.html",
    "/src/minutehand/**/*.css",
    "/src/minutehand/**/*.js",
]
sources = ["src"]

[tool.hatch.build.targets.sdist]
# The source a wheel is built from, and the example a newcomer runs first.
only-include = ["src/minutehand", "examples", "README.md", "LICENSE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]
# A test that reaches a real service is a broken test: only this machine is reachable.
# A test that hangs fails at 60 seconds. Tests run in a random order every time.
addopts = "--strict-markers --strict-config --disable-socket --allow-hosts=127.0.0.1,::1,localhost --allow-unix-socket --timeout=60 -m 'not packaging and not firestore'"
markers = [
    "packaging: builds and installs the package and the image; needs a package index and Docker; run with -m packaging",
    "firestore: rewinds an agent through a real Firestore emulator container; needs Docker and a large image; run with -m firestore",
]
filterwarnings = [
    # A warning raised against our own code is an error. Third-party internals are left alone.
    "error:::minutehand",
    "error:::tests",
    "error:::lints",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "lints", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Named here so the same rules run on every machine and in CI.
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # the formatter wraps code; a long sentence in a docstring or message is left alone
    "RUF012",  # a list default on a Pydantic model is copied per instance; the rule assumes a plain class
    "SIM401",  # suggests dict.get, which the house rules forbid on anything crossing a boundary
    "SIM117",  # nested `with` blocks are sometimes the clearer shape
    "UP047",   # rewriting generic functions to PEP 695 is a style change with no checker behind it
]

[tool.ruff.lint.per-file-ignores]
# The test agent arms a stuck-startup dump before it imports anything else.
"tests/e2e/agents/slack_agent.py" = ["E402"]
