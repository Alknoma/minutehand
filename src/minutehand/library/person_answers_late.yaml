situation: >-
  The person who holds what the agent needs answers, but three days after they are asked.
scenario:
  name: person_answers_late
  starts_at: "2026-08-24T09:00:00Z"   # a Monday
  runs_for: P30D                       # how long the run watches the agent
  people:
    - key: "{team.person_key}"
      name: "{team.person_name}"
      email: "{team.person_email}"
      profile: Holds what the agent needs. Answers, but only days later.
      reply:
        kind: scripted
        delay: {shortest: P3D, longest: P3D}
        replies:
          - {to_ask: 1, facts: ["{team.knows}"]}
