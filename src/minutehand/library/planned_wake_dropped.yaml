situation: >-
  The first wake the agent plans for itself is never delivered: its scheduler drops it.
scenario:
  name: planned_wake_dropped
  starts_at: "2026-08-24T09:00:00Z"   # a Monday
  runs_for: P30D                       # how long the run watches the agent
  people:
    - key: "{team.person_key}"
      name: "{team.person_name}"
      email: "{team.person_email}"
      profile: Does not answer messages.
      reply: {kind: silent}
  dispatch:
    - {wakes: "{team.wakes}", nth: 1, fault: dropped}
