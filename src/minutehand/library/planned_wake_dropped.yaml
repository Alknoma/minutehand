situation: >-
  The person asked never answers, and the first wake the agent plans for itself is never delivered, as a lost
  message or a failed deploy loses it. Nothing else would wake the agent.
good_agent: >-
  It does not rest the work on one delivery: a periodic sweep, a second booking or a watchdog brings it back to the
  open question, and it reminds. An agent with one planned wake and nothing behind it abandons the work in silence.
checks: [no_follow_up, planned_past_due]
patterns: [expiry_on_every_wait]
scenario:
  name: planned_wake_dropped
  goal: "{team.goal}"
  owner: "{team.owner_key}"
  starts_at: "2026-08-24T09:00:00Z"
  deadline_after: P5D
  people:
    - key: "{team.owner_key}"
      name: "{team.owner_name}"
      email: "{team.owner_email}"
      reply: {kind: scripted, replies: []}
    - key: "{team.ask_key}"
      name: "{team.ask_name}"
      email: "{team.ask_email}"
      reply: {kind: silent}
  dispatch:
    - {wakes: "{team.wakes}", nth: 1, fault: dropped}
  expect:
    - {kind: person_asked, person: "{team.ask_key}", by: PT1H}
