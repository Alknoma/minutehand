situation: >-
  An approver in the agent's own product turns an item down, with a reason.
scenario:
  name: approval_rejected
  starts_at: "2026-08-24T09:00:00Z"   # a Monday
  runs_for: P30D                       # how long the run watches the agent
  people:
    - key: "{team.other_key}"
      name: "{team.other_name}"
      email: "{team.other_email}"
      profile: Approves items in the agent's product; turns this one down because it is already covered.
      credential: {kind: generated, env: "{team.credential_env}"}   # how they sign in to the agent's product
      reply:
        kind: scripted
        delay: {shortest: PT2H, longest: P1D}
        replies: []
      takes:
        - {take: reject, facts: ["We are not going ahead with this; it is already covered."]}
