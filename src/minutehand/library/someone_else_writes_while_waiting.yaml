situation: >-
  While the agent waits on one person, a second writes in, unprompted, asking whether the thing is still happening.
scenario:
  name: someone_else_writes_while_waiting
  starts_at: "2026-08-24T09:00:00Z"   # a Monday
  runs_for: P30D                       # how long the run watches the agent
  people:
    - key: "{team.person_key}"
      name: "{team.person_name}"
      email: "{team.person_email}"
      profile: Holds what the agent needs, and answers a day and a half after being asked.
      reply:
        kind: scripted
        delay: {shortest: PT36H, longest: PT36H}
        replies:
          - {to_ask: 1, facts: ["{team.knows}"]}
    - key: "{team.other_key}"
      name: "{team.other_name}"
      email: "{team.other_email}"
      profile: Waiting on the same thing, and impatient about it.
      reply: {kind: scripted, then: silent}
  happenings:
    - kind: posts
      provider: "{team.provider}"
      person: "{team.other_key}"
      after: PT6H
      text: "Hi, quick one: is this still happening this week? I have not heard anything."
