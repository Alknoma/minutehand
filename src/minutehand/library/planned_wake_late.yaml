situation: >-
  The person asked never answers, and the first wake the agent plans for itself is delivered twelve hours after the
  moment it asked for, as a busy queue or a sleeping laptop delivers it.
good_agent: >-
  It plans its reminder with room to spare before the answer falls due, so a late delivery still lands in time, or
  it has a second way back to the work; a plan timed to the due moment itself turns a late scheduler into a late
  reminder.
patterns: [expiry_on_every_wait]
scenario:
  name: planned_wake_late
  goal: "{team.goal}"
  owner: "{team.owner_key}"
  starts_at: "2026-08-24T09:00:00Z"
  deadline_after: P5D
  people:
    - key: "{team.owner_key}"
      name: "{team.owner_name}"
      email: "{team.owner_email}"
      reply: {kind: scripted, replies: []}
    - key: "{team.ask_key}"
      name: "{team.ask_name}"
      email: "{team.ask_email}"
      reply: {kind: silent}
  dispatch:
    - {wakes: "{team.wakes}", nth: 1, fault: late, by: PT12H}
  expect:
    - {kind: person_asked, person: "{team.ask_key}", by: PT1H}
  assess:                              # the team's rules: edit, drop or add to them; nothing else judges the agent
    - id: follows_up_when_due          # an hour past the time an answer was due, the agent has reminded at least once
      each: ask
      where: {person_not: [owner]}
      when: {open_at: due+PT1H}
      count: {follow_ups: {}, since: ask+PT1H, until: due+PT1H}
      at_least: 1
      message: "{person.key}'s answer was due and an hour later the agent had not followed up"
      pattern: expiry_on_every_wait
    - id: planned_to_be_back_when_due  # the agent's own plan, not luck, brought it back when the answer fell due
      each: ask
      where: {person_not: [owner]}
      when: {open_at: due}
      count: {planned_wakes: {}, since: due-PT1H, until: due+PT1H}
      at_least: 1
      severity: review
      pattern: expiry_on_every_wait
    - id: not_done_while_waiting       # the agent does not report done while someone it asked has not answered
      when: {stopped: [agent_done]}
      count: {asks: {open_at: end}}
      at_most: 0
      message: "the agent reported done with {rule.count} ask(s) still unanswered"
      pattern: honest_closure
