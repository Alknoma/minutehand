situation: >-
  The person who holds what the agent needs ignores the first message and answers only when reminded.
scenario:
  name: person_answers_when_reminded
  starts_at: "2026-08-24T09:00:00Z"   # a Monday
  runs_for: P30D                       # how long the run watches the agent
  people:
    - key: "{team.person_key}"
      name: "{team.person_name}"
      email: "{team.person_email}"
      profile: Holds what the agent needs. Lets a first message slide and answers a reminder within hours.
      reply:
        kind: scripted
        delay: {shortest: PT2H, longest: PT6H}
        replies:
          - {to_ask: 2, facts: ["{team.knows}"]}   # nothing to the first message; the reminder is answered
