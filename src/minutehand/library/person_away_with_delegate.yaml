situation: >-
  The person the agent writes to is away from the first message on; their automatic reply names who covers,
  and the cover holds what the agent needs.
scenario:
  name: person_away_with_delegate
  starts_at: "2026-08-24T09:00:00Z"   # a Monday
  runs_for: P30D                       # how long the run watches the agent
  people:
    - key: "{team.person_key}"
      name: "{team.person_name}"
      email: "{team.person_email}"
      profile: On leave for three days; their automatic reply says who covers for them.
      absences:                        # away from the first message on; it gets the automatic reply
        - {trigger: on_first_ask, lasts: P3D, delegate: "{team.other_key}", reason: on leave}
      reply: {kind: scripted, then: silent}   # nothing but the automatic reply
    - key: "{team.other_key}"
      name: "{team.other_name}"
      email: "{team.other_email}"
      profile: Covers while they are away, and answers within a few hours.
      reply:
        kind: scripted
        delay: {shortest: PT1H, longest: PT4H}
        replies:
          - {to_ask: 1, facts: ["{team.knows}"]}
