situation: >-
  Every wake the agent plans for itself is delivered twice, a minute apart.
scenario:
  name: planned_wake_twice
  starts_at: "2026-08-24T09:00:00Z"   # a Monday
  runs_for: P30D                       # how long the run watches the agent
  people:
    - key: "{team.person_key}"
      name: "{team.person_name}"
      email: "{team.person_email}"
      profile: Lets a first message slide and answers a reminder within hours.
      reply:
        kind: scripted
        delay: {shortest: PT2H, longest: PT6H}
        replies:
          - {to_ask: 2, facts: ["{team.knows}"]}
  dispatch:
    - {wakes: "{team.wakes}", fault: twice, by: PT1M}
