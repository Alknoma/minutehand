# Rosa answers two and a half days after she is asked: after the agent's follow-up, which is due at two days.
name: recipe_venue_late
goal: Confirm the venue for the team offsite with Rosa.
owner: owen
starts_at: "2026-08-24T09:00:00Z"
deadline_after: P14D

people:
  - key: owen
    name: Owen Hart
    email: owen@example.com
    reply: {kind: scripted, then: silent}   # told the outcome; owes no answer
  - key: rosa
    name: Rosa Lind
    email: rosa@example.com
    reply:
      kind: scripted
      delay: {shortest: PT60H, longest: PT60H}
      replies:
        - to_ask: 1
          facts: ["The lakeside hall, booked for the 14th."]

expect:
  - kind: person_asked
    person: rosa
  - kind: person_asked
    person: owen
    mentions: [confirmed]
  - kind: relayed            # Owen is told what Rosa said: a fact only her answer carries
    said_by: rosa
    to: owen
    holding: [lakeside hall]

# How the agent must behave, as this team sees it (docs/assessments.md): Minutehand judges nothing else.
assess:
  - id: comes_back_to_an_answer      # an answer is acted on within the hour
    each: ask
    where: {person_not: [owner]}
    when: {answered: true}
    count: {touches: {}, since: answer, until: answer+PT1H}
    at_least: 1
    message: "{person.key} answered and the agent did not come back to it within the hour"
    pattern: expiry_on_every_wait
