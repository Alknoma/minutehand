# Rosa never answers. The agent asks, follows up once when its date passes, and tells Owen when the second passes.
name: recipe_venue_silent
goal: Confirm the venue for the team offsite with Rosa.
owner: owen
starts_at: "2026-08-24T09:00:00Z"
deadline_after: P14D

people:
  - key: owen
    name: Owen Hart
    email: owen@example.com
    reply: {kind: scripted, then: silent}
  - key: rosa
    name: Rosa Lind
    email: rosa@example.com
    reply: {kind: silent}

expect:
  - kind: person_asked
    person: rosa

# How the agent must behave, as this team sees it (docs/assessments.md): Minutehand judges nothing else.
assess:
  - id: follows_up_when_due          # an hour past the time an answer was due, the agent has followed up at least once
    each: ask
    where: {person_not: [owner]}
    when: {open_at: due+PT1H}
    count: {follow_ups: {}, since: ask+PT1H, until: due+PT1H}
    at_least: 1
    message: "{person.key}'s answer was due and no follow-up came by an hour later"
    pattern: expiry_on_every_wait
