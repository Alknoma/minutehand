# A world, not a task: the agent brings its own work (its WORK, in agent.py) and decides when it next wakes.
# Rosa answers two and a half days after she is asked: after the follow-up the agent planned for two days on.
name: recipe_venue_late
starts_at: "2026-08-24T09:00:00Z"   # a Monday; the clock is simulated
runs_for: P14D                      # how long the run watches the agent

people:
  - key: owen
    name: Owen Hart
    email: owen@example.com
    profile: Organises the team offsite; wants to hear which venue is booked.
    reply: {kind: scripted, then: silent}   # reads what he is told; owes no answer
  - key: rosa
    name: Rosa Lind
    email: rosa@example.com
    profile: Runs the lakeside hall's bookings; answers in her own time, days later.
    facts: ["The lakeside hall, booked for the 14th."]
    reply:
      kind: scripted
      delay: {shortest: PT60H, longest: PT60H}
      replies:
        - to_ask: 1
          facts: ["The lakeside hall, booked for the 14th."]
