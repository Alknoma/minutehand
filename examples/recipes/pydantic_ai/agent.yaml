# The Pydantic AI recipe, as Minutehand reaches it. The port is the one agent.py listens on.
name: pydantic_ai_recipe

# The goal arrives on the first wake (POST /wake, reason "start").
goal:
  kind: by_wake

# After every wake Minutehand asks GET /report, and wakes the agent again (reason "due") at the next_wake it names:
# the earliest expected-by date in the agent's deps.
wakes:
  - kind: reported
    wake_url: http://127.0.0.1:8714/wake
    report_url: http://127.0.0.1:8714/report

# A person's Slack message to the agent is pushed here, signed with a secret made for each run.
inbound:
  - provider: slack
    url: http://127.0.0.1:8714/slack/events
    secret:
      kind: generated
      env: AGENT_SLACK_SIGNING_SECRET
