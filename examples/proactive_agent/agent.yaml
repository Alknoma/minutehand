# yaml-language-server: $schema=https://raw.githubusercontent.com/Alknoma/minutehand/integration-main/schemas/agent.schema.json
# The agent runs in a gVisor sandbox whose clock Minutehand owns (docs/design.md, "A sandbox whose clock Minutehand
# owns"): `run_in_sandbox.sh` starts it there, and these two control calls read whether the sandbox is idle and move
# its clock. Nothing is asked of the agent: what it says later it books with Slack as scheduled messages, and each is a
# wake when its moment comes.
version: 1
name: proactive_agent

sandbox:
  deadlines: [runsc, --root, /tmp/minutehand-sandbox, debug, --deadlines, agent]
  advance: [runsc, --root, /tmp/minutehand-sandbox, debug, "--advance-clock={nanoseconds}ns", agent]

inbound:
  - provider: slack
    url: "http://192.168.10.2:8740/slack/events"    # the sandbox's address on its link; the proxy sits on its gateway
    secret: {kind: generated, env: AGENT_SLACK_SIGNING_SECRET}

tick: PT24H     # its bookings bring it back at most once a working day: sizes the wake limit from the world's window
