# The follow-up agent, with its state in PostgreSQL, run from this folder:
#   minutehand run ../sqlite/scenario_silent.yaml --agent agent.yaml -- python agent.py
name: follow_up_postgres

goal:
  kind: by_wake

wakes:
  - kind: reported
    wake_url: http://127.0.0.1:8701/wake
    report_url: http://127.0.0.1:8701/report

inbound:
  - provider: slack
    url: http://127.0.0.1:8701/slack/events
    secret:
      kind: generated
      env: AGENT_SLACK_SIGNING_SECRET

# Minutehand listens as PostgreSQL on 6543 and relays every connection to the real database, recording each
# transaction the agent commits. DATABASE_URL is set, for the agent's program, to the upstream's URL pointed at
# the relay. At the run's start the base is taken (CREATE DATABASE ... TEMPLATE follow_up); a fork makes the
# database again from it and replays the recorded writes up to its checkpoint. No `state:` hooks are needed.
databases:
  - kind: postgres
    name: app
    listen: 127.0.0.1:6543
    upstream: postgres://postgres:secret@127.0.0.1:5432/follow_up
    env: DATABASE_URL
    base: {kind: template}
