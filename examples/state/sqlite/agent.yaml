# The follow-up agent, with its state in a SQLite file, run from this folder:
#   minutehand run scenario_silent.yaml --agent agent.yaml -- python agent.py
name: follow_up_sqlite

goal:
  kind: by_wake

wakes:
  - kind: reported
    wake_url: http://127.0.0.1:8700/wake
    report_url: http://127.0.0.1:8700/report

inbound:
  - provider: slack
    url: http://127.0.0.1:8700/slack/events
    secret:
      kind: generated
      env: AGENT_SLACK_SIGNING_SECRET

# How Minutehand saves and puts back what the agent knows. Each command runs from the folder Minutehand
# was started in, with MINUTEHAND_SNAPSHOT_DIR set to one checkpoint's directory. There is no `stop` or
# `start`: Minutehand started the agent (`-- python agent.py`), so it stops and starts it itself around
# the restore. An agent you start yourself would name them here.
state:
  snapshot: [python, hooks.py, snapshot]
  restore: [python, hooks.py, restore]
  busy: [python, hooks.py, busy]                  # nothing runs after a wake is answered: always idle
  fingerprint: [python, hooks.py, fingerprint]    # a digest of the file, compared after every restore
  quiet: PT0.5S          # no Slack call for half a second before a checkpoint is taken
  settle_limit: PT30S    # otherwise the checkpoint is recorded as not restorable
  answer_limit: PT30S    # the restarted agent must answer GET /report within this
