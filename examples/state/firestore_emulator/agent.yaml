# An agent already running (`python hooks.py start-agent`), with its state in a private Firestore emulator.
# Run from this folder, after `python hooks.py up` and `python hooks.py start-agent`:
#   minutehand run scenario.yaml --agent agent.yaml
name: offsite_firestore

goal:
  kind: by_wake

wakes:
  - kind: reported
    wake_url: http://127.0.0.1:8710/wake
    report_url: http://127.0.0.1:8710/report

state:
  snapshot: [python, hooks.py, snapshot]  # the emulator's own export, while it runs
  busy: [python, hooks.py, busy]          # nothing runs after a wake is answered: always idle
  fingerprint: [python, hooks.py, fingerprint]  # every document's fields, compared after every restore
  stop: [python, hooks.py, stop-agent]    # the agent remembers what it read: it must not outlive a restore
  restore: [python, hooks.py, restore]    # restart the emulator with --import: it cannot import while running
  start: [python, hooks.py, start-agent]
  quiet: PT0.5S
  settle_limit: PT1M
  answer_limit: PT1M                      # after start; the emulator's restart is inside `restore`
  step_limit: PT6M                        # a restart measured at about a minute on a loaded machine
