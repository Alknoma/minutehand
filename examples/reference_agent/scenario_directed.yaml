# Owen adds a requirement six hours in. The agent notes it, and what it reports does not change: two
# checkpoints in a row whose reports read the same, over different databases.
name: venue_directed
goal: Get a venue confirmed for the team's offsite on Friday, and tell Owen its booking reference.
owner: owen
starts_at: 2026-08-24T09:00:00Z
deadline_after: P4D
people:
  - {key: owen, name: Owen Hart, email: owen@example.com, reply: {kind: scripted, then: silent}}
  - key: rosa
    name: Rosa Lind
    email: rosa@lakeside.example
    reply:
      kind: scripted
      delay: {shortest: PT20H, longest: P2D}
      replies:
        - {to_ask: 1, facts: ["Yes, Lakeside Hall is free on Friday. Your booking reference is LH-2291."]}
directions:
  - {text: "We will need a projector there.", after: PT6H}
expect:
  - {kind: person_asked, person: rosa, by: PT1H}
  - {kind: relayed, said_by: rosa, to: owen, holding: [LH-2291]}
