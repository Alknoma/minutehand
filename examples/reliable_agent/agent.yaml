# How Minutehand reaches the agent: the endpoints any proactive agent already serves. Nothing here is a rule.
name: reliable_purchasing_agent
wakes:
  - kind: reported           # the agent names its next wake (its planner's moment) after every wake
    wake_url: "http://127.0.0.1:{run.port}/wake"
    report_url: "http://127.0.0.1:{run.port}/report"
inbound:
  - provider: slack
    url: "http://127.0.0.1:{run.port}/slack/events"
    secret: {kind: generated, env: AGENT_SLACK_SIGNING_SECRET}
outbound:
  - host: api.orders.example  # its own order system: kept with the run, never sent
    name: orders
    kind: store
    collections: [{path: /v1/orders, id: {at: id, format: prefixed, prefix: ord_}, stamps: [{at: created_at}]}]
