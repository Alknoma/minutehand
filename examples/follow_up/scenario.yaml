# Rosa answers a day and a half after she is asked: before the agent's two-day follow-up is due.
name: offsite_venue
goal: Confirm the venue for the team offsite with Rosa.
owner: owen
starts_at: "2026-08-24T09:00:00Z"   # a Monday; the clock is simulated, so any date will do
deadline_after: P14D                # give up after two simulated weeks

people:
  - key: owen
    name: Owen Hart
    email: owen@example.com
    reply:                            # Owen is told the outcome and owes no answer: nothing is scripted for him.
      kind: scripted                  # (`silent` would make every message to him a question he leaves unanswered.)
      replies: []

  - key: rosa
    name: Rosa Lind
    email: rosa@example.com
    reply:
      kind: scripted
      delay:
        shortest: PT36H
        longest: PT36H
      replies:
        - to_ask: 1                   # her answer to the first message she gets
          text: The lakeside hall, booked for the 14th.

# What has to have happened by the end for the run to pass.
expect:
  - kind: person_asked
    person: rosa
  - kind: person_asked
    person: owen
    mentions: [confirmed]
  - kind: relayed                     # Owen is told what Rosa said, not only that something is "confirmed":
    said_by: rosa                     # the tell is a phrase only her answer holds, and the scenario is
    to: owen                          # refused if the goal or anyone else could hand it to the agent.
    tell: lakeside hall
