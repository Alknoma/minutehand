# Rosa answers a day and a half after she is asked: before the agent's two-day follow-up is due.
name: offsite_venue
goal: Confirm the venue for the team offsite with Rosa.
owner: owen
starts_at: "2026-08-24T09:00:00Z"   # a Monday; the clock is simulated, so any date will do
deadline_after: P14D                # give up after two simulated weeks

people:
  - key: owen
    name: Owen Hart
    email: owen@example.com
    reply:                            # Owen is told the outcome and owes no answer: a script with no steps
      kind: scripted                  # that says nothing more once used. (`silent` would make every message to
      then: silent                    # him a question he leaves unanswered.)

  - key: rosa
    name: Rosa Lind
    email: rosa@example.com
    reply:
      kind: scripted
      delay:
        shortest: PT36H
        longest: PT36H
      replies:
        - to_ask: 1                   # what her answer to the first message she gets says; a model writes the words
          facts: ["The lakeside hall, booked for the 14th."]

# What has to have happened by the end for the run to pass.
expect:
  - kind: person_asked
    person: rosa
  - kind: person_asked
    person: owen
    mentions: [confirmed]
  - kind: relayed                     # Owen is told what Rosa said, not only that something is "confirmed":
    said_by: rosa                     # the fact only her answer carries, whatever words it is written in; the
    to: owen                          # scenario is refused if the goal or anyone else could hand it to the agent.
    holding: [lakeside hall]

# How the agent must behave, as this team sees it (docs/assessments.md): Minutehand judges nothing else.
assess:
  - id: comes_back_to_an_answer      # an answer is acted on within the hour
    each: ask
    where: {person_not: [owner]}
    when: {answered: true}
    count: {touches: {}, since: answer, until: answer+PT1H}
    at_least: 1
    message: "{person.key} answered and the agent did not come back to it within the hour"
    pattern: expiry_on_every_wait
