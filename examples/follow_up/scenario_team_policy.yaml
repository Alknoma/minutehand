# The silent world, with one rule of this team's own (docs/assessments.md): an example of optional policy. The world
# says Rosa never answers and declares no time for her answer, so nothing in it says a follow-up is owed; this team
# says one is, once her answer would be due (two days, as the team reckons it), and writes it down.
name: offsite_venue_team_policy
starts_at: "2026-08-24T09:00:00Z"
runs_for: P14D

people:
  - key: owen
    name: Owen Hart
    email: owen@example.com
    profile: Organises the team offsite; wants to hear which venue is booked.
    reply:
      kind: scripted
      then: silent

  - key: rosa
    name: Rosa Lind
    email: rosa@example.com
    profile: Runs the lakeside hall's bookings, and does not answer messages.
    reply:
      kind: silent

assess:
  - id: follows_up_when_due
    each: ask
    where: {person: [rosa]}
    when: {open_at: ask+P2DT1H}
    count: {follow_ups: {}, since: ask+PT1H, until: ask+P2DT1H}
    at_least: 1
    message: "{person.key} was asked two days ago and no follow-up came"
    pattern: expiry_on_every_wait
