# Rosa never answers. An agent that asked once and stopped leaves the job waiting forever.
name: offsite_venue_silent
goal: Confirm the venue for the team offsite with Rosa.
owner: owen
starts_at: "2026-08-24T09:00:00Z"
deadline_after: P14D

people:
  - key: owen
    name: Owen Hart
    email: owen@example.com
    reply:                            # Owen is told the outcome and owes no answer: nothing is scripted for him.
      kind: scripted                  # (`silent` would make every message to him a question he leaves unanswered.)
      replies: []

  - key: rosa
    name: Rosa Lind
    email: rosa@example.com
    reply:
      kind: silent

expect:
  - kind: person_asked
    person: rosa

# How the agent must behave, as this team sees it (docs/assessments.md): Minutehand judges nothing else. Rosa's answer
# is due when her longest delay has passed; an hour after that, she must have been followed up at least once.
assess:
  - id: follows_up_when_due
    each: ask
    where: {person_not: [owner]}
    when: {open_at: due+PT1H}
    count: {follow_ups: {}, since: ask+PT1H, until: due+PT1H}
    at_least: 1
    message: "{person.key}'s answer was due and no follow-up came by an hour later"
    pattern: expiry_on_every_wait
