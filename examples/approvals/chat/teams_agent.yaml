# yaml-language-server: $schema=https://raw.githubusercontent.com/Alknoma/minutehand/integration-main/schemas/agent.schema.json
# The same approval in Microsoft Teams: the agent posts an Adaptive Card with Approve and Reject actions. A press on
# an Action.Execute reaches the bot as an `invoke` (adaptiveCard/action), an Action.Submit as a message with `value`,
# both signed as the Bot Framework signs them. approved.yaml and rejected.yaml play unchanged: a person presses a
# label, whichever service shows it. Validated here, not run: the example agent speaks Slack, not the Bot Framework.
version: 1
name: purchasing_agent_in_teams

wakes:
  - {kind: reported, wake_url: "http://127.0.0.1:8720/wake", report_url: "http://127.0.0.1:8720/report"}

inbound:
  - provider: microsoft
    url: "http://127.0.0.1:8720/api/messages"
