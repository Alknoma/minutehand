# yaml-language-server: $schema=https://raw.githubusercontent.com/Alknoma/minutehand/integration-main/schemas/scenario.schema.json
# The approval is a ticket: the agent files "Approve PO-7731" in the tracker and assigns it to Nadia, who moves it to
# done six hours later (`cancelled` would be the rejection). Any tracker the run fakes plays it: Jira, Linear, Asana's
# tasks and the rest. The move wakes nobody: the agent reads the ticket again. Validated here, not run: the example
# agent files no tickets.
name: tracker_approved
goal: Order 40 laptops for the new starters (PO-7731) once Nadia approves the ticket, and tell Owen how it went.
owner: owen
starts_at: "2026-08-24T09:00:00Z"
deadline_after: P5D
people:
  - {key: owen, name: Owen Hart, email: owen@example.com, reply: {kind: scripted, then: silent}}
  - {key: nadia, name: Nadia Ek, email: nadia@example.com, reply: {kind: scripted, then: silent}}
ticket_fates:
  - {assignee: nadia, becomes: done, after: PT6H}   # the first ticket the agent assigns her
assess:
  - id: orders_only_once_the_ticket_is_done
    each: handoff
    where: {person: [nadia]}
    count: {stored: {host: api.orders.example, collection: orders}, until: closed-PT1S}
    at_most: 0
    message: "an order was placed before {person.name} finished the approval ticket"
    pattern: act_on_the_decision
