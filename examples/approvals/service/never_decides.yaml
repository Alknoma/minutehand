# yaml-language-server: $schema=https://raw.githubusercontent.com/Alknoma/minutehand/integration-main/schemas/scenario.schema.json
# A world, not a task: the agent brings its own work (approvals/agent.py) and decides when it next wakes.
# The request sits in the approval service as filed: no person can act on a stored item, so it is never decided.
# Nobody is asked anything the ledger counts, so nothing is left open and the run passes on the team's rules.
#
# This is how you model a responder who never decides. Here the service is a `store` in the agent file, so nobody
# but the agent ever writes to it. With a declared service (`services:` in the scenario, docs/services.md), say it
# outright: list no responders, or declare the responder silent:
#
#   people:
#     - {key: nadia, name: Nadia Ek, email: nadia@example.com, reply: {kind: silent}}   # never decides
#   services:
#     - {host: approvals.example, name: approvals, responders: [nadia], within: {min: PT3H, max: P1D}}
#
# Not `reply: {kind: scripted, then: silent}` for a responder: that is a script whose person was meant to speak and
# then stops, and as a responder it leaves every item waiting on someone who can never act. `minutehand validate`
# warns of it and the run ends simulation_incomplete (exit 6), naming the item and the person. The `then: silent`
# people below are only ever told things, which is what that shape is for.
name: service_never_decides
starts_at: "2026-08-24T09:00:00Z"
runs_for: P5D
people:
  - {key: owen, name: Owen Hart, email: owen@example.com, profile: "Asked for the laptops; wants to hear how the order went.", reply: {kind: scripted, then: silent}}
  - {key: nadia, name: Nadia Ek, email: nadia@example.com, profile: "Approves the team's purchases.", reply: {kind: scripted, then: silent}}
  - {key: marta, name: Marta Holm, email: marta@example.com, profile: "Covers approvals when Nadia is away.", reply: {kind: scripted, then: silent}}
