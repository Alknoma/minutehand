name: ci

# Every pull request and every push to a protected branch starts this workflow, and the
# one required check (`gate`) always reports. There is no path filter on the workflow on
# purpose: a workflow that does not start reports nothing. What a pull request CHANGES is
# decided inside, by `changes`, and each job runs only when something it exercises changed:
# documentation runs nothing but the workflow lint; a change to tests alone runs the suite
# and not the package; a change to examples alone runs the recipes. A pull request into
# integration-main runs the suite on Linux and Python 3.12 only; a pull request into main,
# a push to a protected branch and a merge-queue entry run the whole matrix (macOS and 3.13
# too). `gate` accepts a skip only where `changes` said the job had nothing to see.
on:
  pull_request:
  push:
    branches: [main, integration-main]
  merge_group:

# Nothing here needs a secret or write access, so a pull request from a fork gets the
# same checks as one from a maintainer.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"

jobs:
  # What this pull request changes, as one flag per job family, and the suite's matrix.
  # A push to a protected branch and a merge-queue entry answer "true" to everything and
  # get the whole matrix: what lands is tested whole. A pull request is diffed against its
  # base commit, so a rebase cannot widen it. A pull request into main gets the whole
  # matrix too: that is the promotion, and macOS and 3.13 are seen before main, not after.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.decide.outputs.code }}
      tests: ${{ steps.decide.outputs.tests }}
      recipes: ${{ steps.decide.outputs.recipes }}
      browser: ${{ steps.decide.outputs.browser }}
      transparent: ${{ steps.decide.outputs.transparent }}
      package: ${{ steps.decide.outputs.package }}
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          full='{"os":["ubuntu-latest","macos-latest"],"python":["3.12","3.13"],"shard":[1,2,3,4],"exclude":[{"os":"macos-latest","python":"3.13"}]}'
          linux='{"os":["ubuntu-latest"],"python":["3.12"],"shard":[1,2,3,4]}'
          if [ "$EVENT" != "pull_request" ]; then
            for flag in code tests recipes browser transparent package; do echo "$flag=true" >> "$GITHUB_OUTPUT"; done
            echo "matrix=$full" >> "$GITHUB_OUTPUT"
            echo "Not a pull request: everything runs, on the whole matrix."
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$changed"
          code=false; tests=false; recipes=false; browser=false; transparent=false; package=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md|LICENSE|NOTICE) continue ;;
            esac
            code=true
            case "$file" in
              # The dependency set and this workflow: everything.
              pyproject.toml|uv.lock|.github/workflows/ci.yml)
                tests=true; recipes=true; browser=true; transparent=true; package=true ;;
              # The package: everything that runs it.
              src/*)
                tests=true; recipes=true; browser=true; transparent=true; package=true ;;
              # What each family runs, and nothing else.
              examples/*|tests/recipes/*|tests/proactive_agent/*)
                tests=true; recipes=true; package=true ;;
              tests/web/*)
                tests=true; browser=true ;;
              tests/providers/slack/*)
                tests=true; transparent=true ;;
              tests/packaging/*|tests/agents/*|Dockerfile|.github/actions/*)
                package=true ;;
              tests/*|lints/*|schemas/*|scripts/*)
                tests=true ;;
              *)
                tests=true; recipes=true; browser=true; transparent=true; package=true ;;
            esac
          done <<< "$changed"
          if [ "$BASE_REF" = "main" ]; then matrix="$full"; else matrix="$linux"; fi
          {
            echo "code=$code"
            echo "tests=$tests"
            echo "recipes=$recipes"
            echo "browser=$browser"
            echo "transparent=$transparent"
            echo "package=$package"
            echo "matrix=$matrix"
          } | tee -a "$GITHUB_OUTPUT"

  types:
    name: Type check
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run pyright

  style:
    name: Format and style
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  lints:
    name: House lints
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      # The directory is the registration: a lint added to lints/ runs here with no edit to this file.
      - run: uv run python -m lints

  workflows:
    name: Workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Conditions, expressions and syntax
        run: uvx --from actionlint-py==1.7.12.24 actionlint
      - name: Permissions, pinning and injection
        run: uvx zizmor==1.30.1 --offline .github/workflows .github/actions

  # The suite in four shards per OS and Python, split by each test's duration (.test_durations, written by
  # `pytest -n auto --store-durations --clean-durations`; a test it does not list counts as the average). Every
  # shard of one run shuffles with the same seed, so each splits the same order and every test runs exactly once.
  tests:
    name: Tests (${{ matrix.os }}, ${{ matrix.python }}, shard ${{ matrix.shard }}/4)
    needs: [changes]
    if: needs.changes.outputs.tests == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Linux and 3.12 for a pull request into integration-main; the whole matrix (macOS, 3.13)
      # for a pull request into main, a push to a protected branch and the merge queue.
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync
      # Random order, in parallel, with no network beyond this machine (pyproject.toml).
      # The seed is the run's id, printed at the top of the output; rerun with --randomly-seed=N.
      - run: uv run pytest -q -n auto --splits 4 --group "$SHARD" --randomly-seed="$SEED"
        env:
          SHARD: ${{ matrix.shard }}
          SEED: ${{ github.run_id }}

  # examples/recipes: an agent per framework (LangGraph, the OpenAI Agents SDK, the Claude Agent SDK, Pydantic AI,
  # the Vercel AI SDK), each run through both of its scenarios against the recipes' fake model, and the proactive
  # agent, whose wake decider is Pydantic AI. The frameworks are
  # the `recipes` dependency group, kept out of every other job; RECIPES_NODE_REQUIRED turns a missing node or a
  # failed `npm ci` from a skip into a failure.
  recipes:
    name: Framework recipes
    needs: [changes]
    if: needs.changes.outputs.recipes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: uv sync --group recipes
      - run: uv run --group recipes pytest -q -rs -n auto -m recipes tests/recipes tests/proactive_agent
        env:
          RECIPES_NODE_REQUIRED: "1"

  # The viewer's page in headless Chromium (tests/web/test_viewer_page.py): it draws a run, every view opens with no
  # script error, redrawing binds no listener twice (the cause of the old page's hang), and a year-long run of ~34,000
  # marks loads and zooms at interactive speed. Playwright is in the dev group; its Chromium is fetched here only.
  # VIEWER_BROWSER_REQUIRED turns a missing browser from a skip into a failure.
  browser:
    name: Viewer in a browser
    needs: [changes]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q -rs -s -m browser tests/web
        env:
          VIEWER_BROWSER_REQUIRED: "1"

  # Transparent capture (docs/containers.md): a client that ignores every proxy variable, in a Linux container whose
  # connections to ports 80 and 443 are sent to the proxy's redirected listener by `minutehand env --format redirect`'s
  # iptables script, is answered by the Slack fake. Needs Docker and alpine's package index; the default run skips it.
  transparent:
    name: Transparent capture in a container
    needs: [changes]
    if: needs.changes.outputs.transparent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull Docker Hub images through a mirror (the runners' shared addresses hit Docker Hub's anonymous pull limit)
        run: |
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -q -m docker tests/providers/slack/test_slack_redirected_container.py

  # What a user installs, as they would install it: the wheel in an environment with none of the
  # dev dependencies, and the image, each running tests/agents/follow_up end to end. Nothing is pushed.
  build:
    name: Package and image (install and run the example)
    needs: [changes]
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull Docker Hub images through a mirror (the runners' shared addresses hit Docker Hub's anonymous pull limit)
        run: |
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - name: Build the sdist and the wheel
        run: uv build
      - name: Install the wheel into a clean environment and run both examples with it
        run: uv run pytest -q -m packaging tests/packaging/test_installed_package.py
      - name: Build the image and run both examples through it
        run: uv run pytest -q -m packaging tests/packaging/test_container_image.py

  # How another repository gets Minutehand (docs/ci.md): the composite action, used by its local path, on a
  # runner with nothing set up but the checkout. It installs into a plain venv with pip, builds the image,
  # and then the installed command and the image each run.
  action:
    name: Setup action (install, run the example, build the image)
    needs: [changes]
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull Docker Hub images through a mirror (the runners' shared addresses hit Docker Hub's anonymous pull limit)
        run: |
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: A plain environment of the runner's own Python
        run: python3 -m venv "$RUNNER_TEMP/venv"
      - id: minutehand
        # The checkout's own copy, by path: what this job tests is the action in this commit as files on disk.
        uses: ./.github/actions/setup-minutehand # zizmor: ignore[self-repository]
        with:
          python: ${{ runner.temp }}/venv/bin/python
          installer: pip
          image-tag: minutehand:action
      - name: The outputs name this commit and the installed version
        env:
          COMMIT: ${{ steps.minutehand.outputs.commit }}
          VERSION: ${{ steps.minutehand.outputs.version }}
        run: |
          test "$COMMIT" = "$(git rev-parse HEAD)"
          test -n "$VERSION"
          "$RUNNER_TEMP/venv/bin/minutehand" --help
      - name: The example, with the installed command
        working-directory: tests/agents/follow_up
        env:
          AGENT_BEHAVIOUR: diligent
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check slack_sdk
          # Rosa's words are a model's: the recipes' stand-in writes them offline, as the example's README says.
          "$RUNNER_TEMP/venv/bin/python" ../../../examples/recipes/fake_model.py &
          until "$RUNNER_TEMP/venv/bin/python" -c 'import socket; socket.create_connection(("127.0.0.1", 8790), 1)' 2>/dev/null; do sleep 0.2; done
          export MINUTEHAND_MODEL_BASE_URL=http://127.0.0.1:8790/v1 MINUTEHAND_MODEL=people MINUTEHAND_MODEL_API_KEY=offline
          "$RUNNER_TEMP/venv/bin/minutehand" run scenario.yaml --agent agent.yaml --state "$RUNNER_TEMP/state" \
            -- "$RUNNER_TEMP/venv/bin/python" agent.py
      - name: The image the action built
        run: docker run --rm minutehand:action --help
      # What a caller's runner holds: this commit's files, no .git, unpacked into a folder named by the
      # ref, reached with an empty `github.action_ref` (a remote action inside a composite step). `uses:`
      # takes no expression, so the folder is named by a fixed 40-hex ref, and that is what must come back.
      - name: The action as a remote caller's runner unpacks it
        run: |
          mkdir -p _actions/minutehand/0123456789abcdef0123456789abcdef01234567
          git archive HEAD | tar -x -C _actions/minutehand/0123456789abcdef0123456789abcdef01234567
      - id: unpacked
        uses: ./_actions/minutehand/0123456789abcdef0123456789abcdef01234567/.github/actions/setup-minutehand # zizmor: ignore[self-repository]
        with:
          python: ${{ runner.temp }}/venv/bin/python
          installer: pip
      - name: The unpacked copy names the ref it was unpacked at
        env:
          COMMIT: ${{ steps.unpacked.outputs.commit }}
        run: test "$COMMIT" = 0123456789abcdef0123456789abcdef01234567

  # main takes pull requests from integration-main and from nowhere else. A branch rule can
  # only constrain the branch being written to, never the branch a pull request comes from,
  # so this has to be a check. It has no `if`: it runs on every event and says yes on all but
  # the one it exists for, because a job that is skipped is a job the gate cannot count on.
  promotion:
    name: Promotion source
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Only integration-main may merge into main
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then
            if [ "$HEAD_REF" != "integration-main" ] || [ "$HEAD_REPO" != "$THIS_REPO" ]; then
              echo "::error::'$HEAD_REPO:$HEAD_REF' cannot merge into main. main takes pull requests from integration-main only. Retarget this pull request at integration-main."
              exit 1
            fi
            echo "Promotion from integration-main."
          else
            echo "Not a pull request into main; nothing to check."
          fi

  # The ONE required status check. Branch rules name this job and nothing else, so a job
  # above can be renamed, split or added without touching the rules. It runs always: a
  # gate that is skipped reports nothing, which a branch rule cannot tell from "still running".
  gate:
    name: gate
    if: always()
    needs: [changes, types, style, lints, workflows, tests, recipes, browser, transparent, build, action, promotion]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Every job succeeded, or was skipped because `changes` said it had nothing to see. A
      # skip of any other job, or a skip whose flag was true, is a failure: a job that did not
      # run proved nothing.
      - name: Every job above succeeded, or was skipped because nothing it exercises changed
        env:
          RESULTS: ${{ toJSON(needs) }}
          FLAGS: ${{ toJSON(needs.changes.outputs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, os, sys
          needs = json.load(sys.stdin)
          flags = json.loads(os.environ["FLAGS"])
          flag_of = {"types": "code", "style": "code", "lints": "code", "tests": "tests", "recipes": "recipes",
                     "browser": "browser", "transparent": "transparent", "build": "package", "action": "package"}
          bad = {}
          for name, job in needs.items():
              may_skip = name in flag_of and flags.get(flag_of[name]) == "false"
              ok = job["result"] == "success" or (may_skip and job["result"] == "skipped")
              if not ok:
                  bad[name] = job["result"]
          for name, result in bad.items():
              print(f"::error::{name}: {result}")
          sys.exit(1 if bad else 0)'
