name: ci

# Every pull request and every push to a protected branch runs all of this. There is no
# path filter on purpose: a workflow that does not start reports nothing, and the one
# required check (`gate`) must always report.
#
# Each job answers one question about the commit, and nothing is asked twice:
#   static     does it type-check, is it formatted, do the house lints and the workflow lints pass
#   tests      does the suite pass, once, on Linux, the only OS an agent runs on (docs/ci.md)
#   browser    does the viewer's page work in a real browser
#   redirect   does transparent capture work in a container that ignores proxy variables
#   build      does the package install clean and does the image run
#   action     does the setup action install it on a bare runner, by path and as a remote caller unpacks it
#   sandbox    does the example agent's whole run pass inside the real gVisor sandbox
#   promotion  may this pull request merge into main
#   gate       did everything above succeed (the only required check)
on:
  pull_request:
  push:
    branches: [main, integration-main]
  merge_group:

# Nothing here needs a secret or write access, so a pull request from a fork gets the
# same checks as one from a maintainer.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"

jobs:
  static:
    name: Types, style, lints, workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - name: Types
        run: uv run pyright
      - name: Format and style
        run: |
          uv run ruff format --check .
          uv run ruff check .
      # The directory is the registration: a lint added to lints/ runs here with no edit to this file.
      - name: House lints
        run: uv run python -m lints
      - name: Workflow files (conditions, expressions, syntax; permissions, pinning, injection)
        run: |
          uvx --from actionlint-py==1.7.12.24 actionlint
          uvx zizmor==1.30.1 --offline .github/workflows .github/actions

  # The whole suite, once, in four shards that run at the same time: the suite is about nine minutes on one of
  # GitHub's runners and under three in four. Linux only, on the image's Python: the agent and the sandbox
  # run on Linux and nowhere else, and a second operating system or interpreter adds another chance for a
  # timing test to fail without adding a fact about the code. Python 3.13, the top of `requires-python`,
  # runs nightly (nightly.yml).
  # The shards are split by each test's duration (.test_durations, written by
  # `pytest -n auto --store-durations --clean-durations`; a test it does not list counts as the average).
  # Every shard shuffles with the same seed, so each splits the same order and every test runs exactly once.
  # Random order, in parallel, with no network beyond this machine (pyproject.toml).
  # The seed is the run's id, printed at the top of the output; rerun with --randomly-seed=N.
  tests:
    name: Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -q -n auto --splits 4 --group "$SHARD" --randomly-seed="$SEED"
        env:
          SHARD: ${{ matrix.shard }}
          SEED: ${{ github.run_id }}

  # The viewer's page in headless Chromium (tests/web/test_viewer_page.py): it draws a run, every view opens with no
  # script error, redrawing binds no listener twice (the cause of the old page's hang), and a year-long run of ~34,000
  # marks loads and zooms at interactive speed. Playwright is in the dev group; its Chromium is fetched here only.
  # VIEWER_BROWSER_REQUIRED turns a missing browser from a skip into a failure.
  browser:
    name: Viewer in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q -rs -s -m browser tests/web
        env:
          VIEWER_BROWSER_REQUIRED: "1"

  # Transparent capture (docs/containers.md): a client that ignores every proxy variable, in a Linux container whose
  # connections to ports 80 and 443 are sent to the proxy's redirected listener by `minutehand env --format redirect`'s
  # iptables script, is answered by the Slack fake. Needs Docker and alpine's package index; the default run skips it.
  redirect:
    name: Transparent capture in a container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull Docker Hub images through a mirror (the runners' shared addresses hit Docker Hub's anonymous pull limit)
        run: |
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -q -m docker tests/providers/slack/test_slack_redirected_container.py

  # What a user installs, as they would install it: the wheel in an environment with none of the
  # dev dependencies, and the image. Nothing is pushed.
  build:
    name: Package and image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull Docker Hub images through a mirror (the runners' shared addresses hit Docker Hub's anonymous pull limit)
        run: |
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - name: Build the sdist and the wheel
        run: uv build
      - name: The distributions as a user installs them (tests/packaging, as the release workflow runs it)
        run: MINUTEHAND_DIST="$PWD/dist" uv run pytest -m packaging tests/packaging -p no:randomly
      - name: Build the image and run its entrypoint
        run: |
          docker build -t minutehand:ci .
          docker run --rm minutehand:ci --help

  # How another repository gets Minutehand (docs/ci.md): the composite action, used by its local path, on a
  # runner with nothing set up but the checkout. It installs into a plain venv with pip and builds the image.
  action:
    name: Setup action (install, build the image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull Docker Hub images through a mirror (the runners' shared addresses hit Docker Hub's anonymous pull limit)
        run: |
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: A plain environment of the runner's own Python
        run: python3 -m venv "$RUNNER_TEMP/venv"
      - id: minutehand
        # The checkout's own copy, by path: what this job tests is the action in this commit as files on disk.
        uses: ./.github/actions/setup-minutehand # zizmor: ignore[self-repository]
        with:
          python: ${{ runner.temp }}/venv/bin/python
          installer: pip
          image-tag: minutehand:action
      - name: The outputs name this commit and the installed version
        env:
          COMMIT: ${{ steps.minutehand.outputs.commit }}
          VERSION: ${{ steps.minutehand.outputs.version }}
        run: |
          test "$COMMIT" = "$(git rev-parse HEAD)"
          test -n "$VERSION"
          "$RUNNER_TEMP/venv/bin/minutehand" --help
      - name: The image the action built
        run: docker run --rm minutehand:action --help
      # What a caller's runner holds: this commit's files, no .git, unpacked into a folder named by the
      # ref, reached with an empty `github.action_ref` (a remote action inside a composite step). `uses:`
      # takes no expression, so the folder is named by a fixed 40-hex ref, and that is what must come back.
      - name: The action as a remote caller's runner unpacks it
        run: |
          mkdir -p _actions/minutehand/0123456789abcdef0123456789abcdef01234567
          git archive HEAD | tar -x -C _actions/minutehand/0123456789abcdef0123456789abcdef01234567
      - id: unpacked
        uses: ./_actions/minutehand/0123456789abcdef0123456789abcdef01234567/.github/actions/setup-minutehand # zizmor: ignore[self-repository]
        with:
          python: ${{ runner.temp }}/venv/bin/python
          installer: pip
      - name: The unpacked copy names the ref it was unpacked at
        env:
          COMMIT: ${{ steps.unpacked.outputs.commit }}
        run: test "$COMMIT" = 0123456789abcdef0123456789abcdef01234567

  # The one whole run of an agent, against a real sandbox: builds the gVisor whose clock Minutehand owns
  # (sandbox/build.sh) and runs the example agent through Minutehand inside it, in the lab container (sandbox/lab).
  # A privileged container is what `runsc do` needs for its network namespace; GitHub's Ubuntu runners allow it.
  sandbox:
    name: The example agent, in the sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sandbox/build.sh
      - run: docker build -t minutehand-lab sandbox/lab
      - name: Run the quiet world
        run: |
          docker run --rm --privileged -v "$PWD:/work" -v "$PWD/sandbox/dist:/opt/gv:ro" minutehand-lab \
            sandbox/lab/run-example.sh examples/proactive_agent/worlds/quiet.yaml | tee quiet.log
          grep -q "follow-ups made: 2" quiet.log
          grep -q "wakes: 4, of which changed nothing: 0" quiet.log
      - name: Run the answers world
        run: |
          docker run --rm --privileged -v "$PWD:/work" -v "$PWD/sandbox/dist:/opt/gv:ro" minutehand-lab \
            sandbox/lab/run-example.sh examples/proactive_agent/worlds/answers.yaml | tee answers.log
          grep -q "still open at the end: 0" answers.log
          grep -q "person_replied" answers.log
      - name: Run the seal's probe
        run: |
          docker run --rm --privileged -v "$PWD:/work" -v "$PWD/sandbox/dist:/opt/gv:ro" minutehand-lab \
            sandbox/lab/run-example.sh examples/proactive_agent/worlds/quiet.yaml \
            ../../sandbox/lab/seal-probe/probe.yaml ../../sandbox/lab/seal-probe/run_in_sandbox.sh | tee probe.log || true
          grep -q "resolve example.com: 192.168.10.3" probe.log
          grep -q "slack.com/api/api.test (no proxy): HTTP 501" probe.log
          grep -q "example.com (undeclared host): HTTP 502" probe.log
          grep -q "1.1.1.1/ (by address): HTTP 502" probe.log
          grep -q "api.anthropic.com/v1/models (a model host: tunnelled out): HTTP 401" probe.log
          grep -q "udp 8.8.8.8:4444: no reply" probe.log

  # main takes pull requests from integration-main and from nowhere else. A branch rule can
  # only constrain the branch being written to, never the branch a pull request comes from,
  # so this has to be a check. It has no `if`: it runs on every event and says yes on all but
  # the one it exists for, because a job that is skipped is a job the gate cannot count on.
  promotion:
    name: Promotion source
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Only integration-main may merge into main
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then
            if [ "$HEAD_REF" != "integration-main" ] || [ "$HEAD_REPO" != "$THIS_REPO" ]; then
              echo "::error::'$HEAD_REPO:$HEAD_REF' cannot merge into main. main takes pull requests from integration-main only. Retarget this pull request at integration-main."
              exit 1
            fi
            echo "Promotion from integration-main."
          else
            echo "Not a pull request into main; nothing to check."
          fi

  # The ONE required status check. Branch rules name this job and nothing else, so a job
  # above can be renamed, split or added without touching the rules. It runs always: a
  # gate that is skipped reports nothing, which a branch rule cannot tell from "still running".
  gate:
    name: gate
    if: always()
    needs: [static, tests, browser, redirect, build, action, sandbox, promotion]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job above succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {name: job["result"] for name, job in needs.items() if job["result"] != "success"}
          for name, result in bad.items():
              print(f"::error::{name}: {result}")
          sys.exit(1 if bad else 0)'
