name: sandbox

# Builds the gVisor sandbox whose clock Minutehand owns (sandbox/build.sh) and runs the example agent through
# Minutehand inside it, in the lab container (sandbox/lab): the one whole run of an agent, against a real sandbox.
# A privileged container is what `runsc do` needs for its network namespace; GitHub's Ubuntu runners allow it.
on:
  pull_request:
  push:
    branches: [main, integration-main]

permissions:
  contents: read

concurrency:
  group: sandbox-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  example-in-the-sandbox:
    name: The example agent, in the sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sandbox/build.sh
      - run: docker build -t minutehand-lab sandbox/lab
      - name: Run the quiet world
        run: |
          docker run --rm --privileged -v "$PWD:/work" -v "$PWD/sandbox/dist:/opt/gv:ro" minutehand-lab \
            sandbox/lab/run-example.sh examples/proactive_agent/worlds/quiet.yaml | tee quiet.log
          grep -q "follow-ups made: 2" quiet.log
          grep -q "wakes: 4, of which changed nothing: 0" quiet.log
      - name: Run the answers world
        run: |
          docker run --rm --privileged -v "$PWD:/work" -v "$PWD/sandbox/dist:/opt/gv:ro" minutehand-lab \
            sandbox/lab/run-example.sh examples/proactive_agent/worlds/answers.yaml | tee answers.log
          grep -q "still open at the end: 0" answers.log
          grep -q "person_replied" answers.log
      - name: Run the seal's probe
        run: |
          docker run --rm --privileged -v "$PWD:/work" -v "$PWD/sandbox/dist:/opt/gv:ro" minutehand-lab \
            sandbox/lab/run-example.sh examples/proactive_agent/worlds/quiet.yaml \
            ../../sandbox/lab/seal-probe/probe.yaml ../../sandbox/lab/seal-probe/run_in_sandbox.sh | tee probe.log || true
          grep -q "resolve example.com: 192.168.10.3" probe.log
          grep -q "slack.com/api/api.test (no proxy): HTTP 501" probe.log
          grep -q "example.com (undeclared host): HTTP 502" probe.log
          grep -q "1.1.1.1/ (by address): HTTP 502" probe.log
          grep -q "api.anthropic.com/v1/models (a model host: tunnelled out): HTTP 401" probe.log
          grep -q "udp 8.8.8.8:4444: no reply" probe.log
