name: release

# A release is cut by publishing a GitHub Release whose tag is `v` and the version pyproject.toml writes
# (docs/releasing.md). Nothing else starts this workflow: not a pushed tag, not a branch, not a schedule. A
# Release is a deliberate act with notes a reader sees, and a draft is reviewed before it is published; a pushed
# tag is one `git push --tags` away from publishing by accident.
#
#   build   the sdist and the wheel, `twine check`, and the wheel installed into a clean environment running
#           the example and a pytest suite that uses the plugin
#   pypi    those same files uploaded to PyPI by Trusted Publishing (OIDC): no token is stored anywhere; PyPI
#           trusts this repository, this file and the `pypi` environment, and nothing else
#   image   ghcr.io/alknoma/minutehand, built from the same commit, tagged with the version and the commit
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  UV_LOCKED: "1"
  IMAGE: ghcr.io/alknoma/minutehand

jobs:
  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          # No cache in a workflow that publishes: a cache another workflow wrote is not an input to a release.
          enable-cache: false
      - id: version
        name: The tag names the version pyproject.toml writes
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::the release's tag is '$TAG' and pyproject.toml writes version '$version'; the tag must be 'v$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: uv sync
      - name: Build the sdist, and the wheel from it
        run: uv build
      - name: The metadata and README as PyPI will read them
        run: uvx twine==7.0.0 check --strict dist/*
      - name: The wheel as a user installs it, run from a clean environment
        run: |
          python3 -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          "$RUNNER_TEMP/wheel/bin/minutehand" --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment is where a human can be required to approve; PyPI's trusted publisher names it too.
    environment:
      name: pypi
      url: https://pypi.org/project/minutehand/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # the OIDC token PyPI exchanges for a short-lived upload token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # After PyPI, so an image tag never names a version `pip install` cannot find.
  image:
    name: Push the image to GHCR
    needs: [build, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to ghcr.io/alknoma/minutehand with this run's GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for amd64 and arm64 and push, tagged with the version and the commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ github.sha }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tags=(--tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-$COMMIT")
          if [ "$PRERELEASE" != "true" ]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx build . \
            --target runtime \
            --platform linux/amd64,linux/arm64 \
            "${tags[@]}" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$COMMIT" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --push
