name: release

# A release is cut by publishing a GitHub Release whose tag is `v` and the version pyproject.toml writes
# (docs/releasing.md). Nothing else starts this workflow: not a pushed tag, not a branch, not a schedule. A
# Release is a deliberate act with notes a reader sees, and a draft is reviewed before it is published; a pushed
# tag is one `git push --tags` away from publishing by accident.
#
#   build        the sdist and the wheel of `minutehand` and of `minutehand-agent` (packages/minutehand-agent,
#                released with it at the same version), `twine check`, and the wheels installed into clean
#                environments running the example and a pytest suite that uses the plugin
#   pypi-agent   minutehand-agent's files uploaded to PyPI by Trusted Publishing (OIDC): no token is stored
#                anywhere; PyPI trusts this repository, this file and the `pypi` environment, and nothing else.
#                First, because minutehand requires exactly this version of it
#   pypi         minutehand's files, the same way, once minutehand-agent is on PyPI
#   image        ghcr.io/alknoma/minutehand, built from the same commit, tagged with the version and the commit
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  UV_LOCKED: "1"
  IMAGE: ghcr.io/alknoma/minutehand

jobs:
  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          # No cache in a workflow that publishes: a cache another workflow wrote is not an input to a release.
          enable-cache: false
      - id: version
        name: The tag names the version pyproject.toml writes, and minutehand-agent is released at it
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::the release's tag is '$TAG' and pyproject.toml writes version '$version'; the tag must be 'v$version'"
            exit 1
          fi
          agent="$(python3 -c 'import tomllib; print(tomllib.load(open("packages/minutehand-agent/pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$agent" != "$version" ]; then
            echo "::error::packages/minutehand-agent/pyproject.toml writes version '$agent' and pyproject.toml '$version'; they are released together"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: uv sync
      - name: Build each sdist, and each wheel from it, one folder per distribution
        run: |
          uv build --package minutehand --out-dir dist/
          uv build --package minutehand-agent --out-dir dist-agent/
      - name: The metadata and README as PyPI will read them
        run: uvx twine==7.0.0 check --strict dist/* dist-agent/*
      - name: The sdists and wheels as a user installs them, run from clean environments
        run: uv run pytest -q -m packaging tests/packaging/test_installed_package.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-agent
          path: dist-agent/
          if-no-files-found: error

  # Its own job and its own trusted publisher on PyPI (project minutehand-agent), before minutehand: a minutehand
  # on PyPI requiring a minutehand-agent that is not would install nowhere.
  pypi-agent:
    name: Publish minutehand-agent to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/minutehand-agent/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # the OIDC token PyPI exchanges for a short-lived upload token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-agent
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  pypi:
    name: Publish minutehand to PyPI
    needs: [build, pypi-agent]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment is where a human can be required to approve; PyPI's trusted publisher names it too.
    environment:
      name: pypi
      url: https://pypi.org/project/minutehand/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # the OIDC token PyPI exchanges for a short-lived upload token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # After PyPI, so an image tag never names a version `pip install` cannot find.
  image:
    name: Push the image to GHCR
    needs: [build, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to ghcr.io/alknoma/minutehand with this run's GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for amd64 and arm64 and push, tagged with the version and the commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ github.sha }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tags=(--tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-$COMMIT")
          if [ "$PRERELEASE" != "true" ]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx build . \
            --target runtime \
            --platform linux/amd64,linux/arm64 \
            "${tags[@]}" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$COMMIT" \
            --label "org.opencontainers.image.licenses=FSL-1.1-ALv2" \
            --push
